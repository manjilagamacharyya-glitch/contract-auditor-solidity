<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contract Auditor</title>
    <meta name="description" content="AI-powered Solidity smart contract auditor for detecting vulnerabilities, generating reports, and anchoring audit trails on Sepolia." />
    <meta property="og:title" content="Contract Auditor" />
    <meta property="og:description" content="AI-powered Solidity smart contract auditor for detecting vulnerabilities, generating reports, and anchoring audit trails on Sepolia." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        function isExtensionError(msg, src, stack) {
          var str = (msg + ' ' + src + ' ' + stack).toLowerCase();
          return str.indexOf('metamask') !== -1 || str.indexOf('chrome-extension://') !== -1 || str.indexOf('moz-extension://') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message || '', e.filename || '', (e.error && e.error.stack) || '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = (reason && reason.message) || String(reason || '');
          var stack = (reason && reason.stack) || '';
          if (isExtensionError(msg, '', stack)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
